name: Setup
description: Setup the environment for the project

inputs:
  working-directory:
    description: 'Working directory to run in, default .'
    required: false
    default: '.'
  download-translations:
    description: 'Whether to download translations as part of setup, default true'
    required: false
    default: 'true'
  cache:
    description: 'Whether to restore and save dependency and Lage caches, default true'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install node
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: 24
        package-manager-cache: false
    - name: Install pnpm
      working-directory: ${{ inputs.working-directory }}
      run: npm install -g "$(node -p "require('./package.json').packageManager")"
      shell: bash
    - name: Get Node version
      id: get-node
      run: echo "version=$(node -v)" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Cache
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      if: ${{ inputs.cache == 'true' }}
      id: cache
      with:
        path: |
          ${{ format('{0}/node_modules', inputs.working-directory) }}
          ${{ format('{0}/packages/*/node_modules', inputs.working-directory) }}
        key: pnpm-v1-${{ runner.os }}-${{ steps.get-node.outputs.version }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
    - name: Get pnpm store path
      id: pnpm-store
      if: ${{ inputs.cache == 'true' && steps.cache.outputs.cache-hit != 'true' }}
      working-directory: ${{ inputs.working-directory }}
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Cache pnpm store
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      if: ${{ inputs.cache == 'true' && steps.cache.outputs.cache-hit != 'true' }}
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ steps.get-node.outputs.version }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ steps.get-node.outputs.version }}-
          pnpm-store-${{ runner.os }}-
    - name: Ensure Lage cache directory exists
      run: mkdir -p "$WORKING_DIRECTORY/node_modules/.cache/lage"
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
    - name: Cache Lage
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      if: ${{ inputs.cache == 'true' }}
      with:
        path: ${{ format('{0}/node_modules/.cache/lage', inputs.working-directory) }}
        key: lage-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          lage-${{ runner.os }}-${{ github.job }}-
    - name: Install
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
      shell: bash
      if: steps.cache.outputs.cache-hit != 'true'
    - name: Prune Lage cache
      working-directory: ${{ inputs.working-directory }}
      run: pnpm exec lage cache --prune 7
      shell: bash
      if: ${{ inputs.cache == 'true' }}
    - name: Download translations
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: actualbudget/translations
        path: ${{ inputs.working-directory }}/packages/desktop-client/locale
        persist-credentials: false
      if: ${{ inputs.download-translations == 'true' && !env.ACT }}
    - name: Remove untranslated languages
      run: packages/desktop-client/bin/remove-untranslated-languages
      shell: bash
      if: ${{ inputs.download-translations == 'true' && !env.ACT }}
