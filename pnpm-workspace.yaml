packages:
  - packages/*

# Supply-chain defense: don't install package versions published less than 3
# days ago, giving the community time to catch compromised releases.
minimumReleaseAge: 4320

# Secure default: only these packages may run install scripts.
allowBuilds:
  '@parcel/watcher': false
  argon2: true
  bcrypt: true
  core-js: false
  electron: true
  electron-winstaller: false
  esbuild: true
  sharp: true

overrides:
  minimatch@3.1.2: 3.1.5
  serialize-javascript: ^7.0.5
  socks: '>=2.8.3'
  webpackbar: ^7.0.0

patchedDependencies:
  vite-plugin-node-polyfills@0.28.0: patches/vite-plugin-node-polyfills@0.28.0.patch

# Workspaces reference these as `catalog:`, so a dependency has one version
# repo-wide; in strict mode `pnpm add` records new dependencies here too.
catalogMode: strict

catalog:
  '@emotion/css': ^11.13.5
  '@internationalized/date': ^3.12.4
  '@octokit/rest': ^22.0.1
  '@playwright/test': 1.61.1
  '@rolldown/plugin-babel': ~0.2.4
  '@testing-library/react': 16.3.3
  '@types/better-sqlite3': ^9.6.0
  '@types/debug': ^4.1.12
  '@types/node': ^22.20.5
  '@types/react': ^19.3.0
  '@typescript/native-preview': 'beta'
  '@vitejs/plugin-react': ^6.1.2
  babel-plugin-react-compiler: ^1.0.0
  better-sqlite3: ^13.0.3
  cross-env: ^10.1.0
  csv-stringify: ^6.9.0
  date-fns: ^4.4.0
  es-toolkit: ^1.52.0
  hyperformula: ^3.5.0
  lru-cache: ^11.5.3
  minimatch: ^11.0.4
  npm-run-all: ^4.1.5
  react: 19.3.0
  react-aria-components: ^1.22.1
  react-dom: 19.3.0
  rollup-plugin-visualizer: ^7.1.1
  typescript-strict-plugin: ^2.4.4
  usehooks-ts: ^3.1.1
  uuid: ^14.0.3
  vite: ^8.3.4
  vite-plugin-node-polyfills: 0.28.0
  vitest: ^5.0.4
  workbox-window: ^7.4.1
